    <!-- Dynamic Meta Tags Script: Inasoma DB settings + post/profile URL params -->
    <script>
      (function() {
        // Always update current URL
        document.getElementById('og-url').setAttribute('content', window.location.href);

        // 1) Check URL params for direct post/profile sharing
        const urlParams = new URLSearchParams(window.location.search);
        const titleParam = urlParams.get('title') || urlParams.get('post_title') || urlParams.get('name');
        const descParam = urlParams.get('desc') || urlParams.get('post_desc') || urlParams.get('bio');
        const imageParam = urlParams.get('image') || urlParams.get('post_img') || urlParams.get('avatar');

        if (titleParam) {
          document.title = titleParam + ' - SEXY LIVE ROOM';
          document.getElementById('og-title').setAttribute('content', titleParam);
          document.getElementById('twitter-title').setAttribute('content', titleParam);
        }
        if (descParam) {
          document.getElementById('og-desc').setAttribute('content', descParam);
          document.getElementById('twitter-desc').setAttribute('content', descParam);
        }
        if (imageParam) {
          document.getElementById('og-image').setAttribute('content', imageParam);
          document.getElementById('twitter-image').setAttribute('content', imageParam);
        }

        // 2) Load SEO settings from DB (app_settings) and update meta tags
        // Only runs if no post/profile params are present
        if (!titleParam && !descParam && !imageParam) {
          var SUPABASE_URL = '';
          var SUPABASE_ANON_KEY = '';
          // Read from window env injected by Vite (only available after React loads)
          // Fallback: fetch directly
          try {
            var envScript = document.querySelector('script[src*="main"]');
            if (envScript && window.__SUPABASE_URL__) {
              SUPABASE_URL = window.__SUPABASE_URL__;
              SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY__;
            }
          } catch(e) {}

          // Try localStorage cache first (set by React app)
          try {
            var cached = localStorage.getItem('slr_settings_cache');
            if (cached) {
              var s = JSON.parse(cached);
              if (s.site_title) {
                document.title = s.site_title;
                document.getElementById('og-title').setAttribute('content', s.site_title);
                document.getElementById('twitter-title').setAttribute('content', s.site_title);
              }
              if (s.site_description) {
                document.getElementById('og-desc').setAttribute('content', s.site_description);
                document.getElementById('twitter-desc').setAttribute('content', s.site_description);
                document.querySelector('meta[name="description"]') && document.querySelector('meta[name="description"]').setAttribute('content', s.site_description);
              }
              if (s.site_og_image) {
                document.getElementById('og-image').setAttribute('content', s.site_og_image);
                document.getElementById('twitter-image').setAttribute('content', s.site_og_image);
              }
            }
          } catch(e) {}
        }
      })();
    </script>

    <script>
      // Register Service Worker for PWA and Push Notifications
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(registration) {
              console.log('SW registered:', registration.scope);
            })
            .catch(function(err) {
              console.log('SW registration failed:', err);
            });
        });
      }

      // PWA Install prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        window.__pwaInstallPrompt = e;
        // Dispatch custom event for React components to listen
        window.dispatchEvent(new CustomEvent('pwaInstallAvailable'));
      });

      window.addEventListener('appinstalled', function() {
        console.log('PWA installed successfully!');
        window.dispatchEvent(new CustomEvent('pwaInstalled'));
      });
    </script>
